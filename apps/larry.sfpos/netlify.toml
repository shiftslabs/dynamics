[build]
  base = "apps/larry.sfpos"
  command = "npm install --no-audit --no-fund && npm run build"
  publish = "dist"
  ignore = "git diff --quiet   -- apps/larry.sfpos"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY_USE_PNPM = "false"
  NETLIFY_USE_YARN = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
